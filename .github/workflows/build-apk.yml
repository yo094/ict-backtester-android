
name: Build ICT Backtester APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Extract project
        run: unzip -q ICT_Backtester_Android_Cloud_Build.zip

      - name: Fix Kotlin progress property
        run: |
          sed -i '/private lateinit var webView: WebView/a\    private lateinit var progress: ProgressBar' ICT_Backtester_Android/app/src/main/java/com/ictbacktester/app/MainActivity.kt



      - name: Build APK
        run: gradle --no-daemon -p ICT_Backtester_Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ICT-Backtester-Android-APK
          path: ICT_Backtester_Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
